include:
  - path: infra/langfuse/docker-compose.yml
    env_file: .env

services:
  app-db:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_DB_USER:-helpdesk}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME:-helpdesk}
    ports:
      - 127.0.0.1:5433:5432   # 5432 is taken by Langfuse's Postgres
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-helpdesk}"]
      interval: 3s
      retries: 10

volumes:
  app_db_data:
