    - doc_id: it-laptop-request
      version: "1.0"
      section: "Laptop Request and Replacement"

- id: Q16
  split: tune
  type: near-miss
  question: "How many weeks of parental leave do I get?"
  answer: "No number is given: \"See your contract\", and contact People Operations at hr@example.com."
  sources:
    - doc_id: hr-leave-policy
      version: "1.0"
      section: "Leave types at a glance"

- id: Q17
  split: tune
  type: near-miss
  question: "What mileage rate can I claim for an electric scooter?"
  answer: "Only a car mileage rate is defined (EUR 0.35 per km, Clause 2.3); there is no scooter rate."
  sources:
    - doc_id: hr-expense-travel-policy
      version: "1.0"
      section: "Part 2: Business travel"

- id: Q18
  split: tune
  type: multi-doc
  question: "When does a new starter's laptop arrive, and how early must the hiring manager request it?"
  answer: "Shipped to the home address 3 working days before the start date; the hiring manager requests it at least 10 working days before the start date."
  sources:
    - doc_id: hr-onboarding-guide
      version: "1.0"
      section: "Equipment"
    - doc_id: it-laptop-request
      version: "1.0"
      section: "Requesting or replacing a laptop"

- id: Q19
  split: tune
  type: multi-doc
  question: "I clicked a phishing link on Saturday evening. Who do I call and how fast will they respond?"
  answer: "Report within 1 hour: call ext. 4357 and choose option 9 (or security@example.com). It is P1: response in 15 minutes, resolution target 4 hours."
  sources:
    - doc_id: it-security-incident-reporting
      version: "1.0"
      section: "Reporting a suspected incident"
    - doc_id: gen-service-desk-contacts
      version: "1.0"
      section: "Priorities and response times"

- id: Q20
  split: tune
  type: multi-doc
  question: "How long do I have to submit expenses normally, and how long if I am leaving?"
  answer: "Normally within 30 days of the cost (Clause 1.2); leavers must submit final expenses within 10 days of their last working day."
  sources:
    - doc_id: hr-expense-travel-policy
      version: "1.0"
      section: "Part 1: Claiming expenses"
    - doc_id: hr-offboarding-checklist
      version: "1.0"
      section: "Employee"

- id: Q21
  split: tune
  type: single
  question: "When do I get paid?"
  answer: "Monthly on the 25th; if the 25th falls on a weekend or a company or public holiday, on the previous working day. Payslips are in Orbit HR under Pay two working days before."
  sources:
    - doc_id: hr-benefits-payroll
      version: "1.0"
      section: "When do I get paid?"

- id: Q22
  split: tune
  type: single
  question: "How long can I have admin rights on my laptop?"
  answer: "At most 30 days: request Temporary admin rights in Assist with a reason and your line manager's approval; DeviceDock removes them automatically when the period ends, and a new period is reviewed again."
  sources:
    - doc_id: it-software-catalogue
      version: "1.0"
      section: "Temporary admin rights"

- id: Q23
  split: tune
  type: trap
  question: "SecureLink shows error 691. Is the VPN server down?"
  answer: "No. Error 691 means the Corvane ID password is wrong or was recently changed, or the account is locked. Sign in at id.example.com to check your password."
  sources:
    - doc_id: it-vpn-guide
      version: "1.0"
      section: "Error codes"

- id: Q24
  split: tune
