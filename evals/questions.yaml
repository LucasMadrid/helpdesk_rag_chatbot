  type: image-error-code
  question: "My laptop shows a BitLocker recovery screen. What do I do?"
  answer: "Call the Service Desk on ext. 4357 from another phone; they read you the recovery key after verifying your identity. Never type the key into a website or chat."
  sources:
    - doc_id: it-known-errors-faq
      version: "1.0"
      section: "My laptop shows \"BitLocker recovery\". What do I do?"

- id: Q33
