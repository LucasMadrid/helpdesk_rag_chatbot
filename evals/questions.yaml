  type: trap
  question: "Does my onboarding buddy support me for my whole probation?"
  answer: "No. The buddy supports you for 6 weeks; probation lasts 6 months."
  sources:
    - doc_id: hr-onboarding-guide
      version: "1.0"
      section: "Week 1"

- id: Q32
