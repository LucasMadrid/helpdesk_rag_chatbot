  question: "What is the dress code at the Lisbon office?"
  answer: "Not covered in the docs; the bot should say so and suggest asking People Operations or your manager."
  sources: []

- id: Q25
  split: tune
  type: multi-doc
  question: "I have 16 hours of approved overtime, and 26 December 2026 is a Saturday. How many compensation days do I get, and does the holiday one count towards the overtime limit?"
  answer: "3 in total: 2 for the overtime (1 per 8 hours, up to 10 a year) and 1 because the company holiday falls on a weekend. The holiday compensation day is a separate entitlement and does not count towards the limit of 10."
  sources:
    - doc_id: hr-working-hours-overtime
      version: "1.0"
      section: "Compensation for overtime"
    - doc_id: hr-leave-policy
      version: "1.0"
      section: "Company holidays"

- id: Q26
  split: holdout
  type: single
  question: "How many unused vacation days can I carry over into next year?"
  answer: "Up to 5, and they must be used by 31 March of the following year. Days above the 5-day limit expire on 31 December unless People Operations approves an exception in writing."
  sources:
    - doc_id: hr-leave-policy
      version: "1.0"
      section: "Booking and carrying over vacation"

- id: Q27
  split: holdout
  type: single
  question: "What is the hotel limit per night for a business trip to London?"
  answer: "EUR 220 per night including taxes, because London is a capital city (EUR 180 elsewhere). A higher rate needs your manager's written approval before booking."
  sources:
    - doc_id: hr-expense-travel-policy
      version: "1.0"
      section: "Part 2: Business travel"

- id: Q28
  split: holdout
  type: version
  question: "Do I have to change my Corvane ID password every 90 days?"
  answer: "No. Passwords no longer expire on a schedule; change it only when a compromise is suspected (the 90-day expiry is from superseded v1.0)."
  sources:
    - doc_id: it-password-mfa-policy
      version: "2.0"
      section: "Password expiry"

- id: Q29
  split: holdout
  type: version
  question: "Can I work fully remote?"
  answer: "Only in exceptional cases with director approval: your manager raises it with your department director, who decides with People Operations (v1.0, which did not offer fully remote work, is superseded)."
  sources:
    - doc_id: hr-remote-work-policy
      version: "2.0"
      section: "Fully remote roles"

- id: Q30
  split: holdout
  type: trap
  question: "I approved an MFA prompt I didn't start, so I'll just reset my password. Is that enough?"
  answer: "No. Report it immediately to security@example.com or call ext. 4357, then reset your password at id.example.com/reset. It is a security incident, always P1."
  sources:
    - doc_id: it-known-errors-faq
