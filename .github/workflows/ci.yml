name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway database for the integration tests; the password is not a secret.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: helpdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_APP_DB_URL: postgresql://helpdesk:ci-only-password@localhost:5432/helpdesk
    steps:
      - uses: actions/checkout@v4

      - name: Check for a Python project
        id: project
        run: |
          if [ -f pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No pyproject.toml yet, skipping lint and tests."
          fi

      - name: Install uv
        if: steps.project.outputs.exists == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: steps.project.outputs.exists == 'true'
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        if: steps.project.outputs.exists == 'true'
        run: uv run --with ruff ruff check .

      - name: Format check (ruff)
        if: steps.project.outputs.exists == 'true'
        run: uv run --with ruff ruff format --check .

      - name: Run tests
        if: steps.project.outputs.exists == 'true'
        run: uv run pytest
